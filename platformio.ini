[env:esp32-3248S035R]
; Pinned so every build uses the same Arduino core (2.0.17, ESP-IDF 4.4.7).
; Upgrade it together with esp32_smartdisplay and the board definition.
platform = espressif32@7.1.3
board = esp32-3248S035R
framework = arduino
monitor_speed = 115200
monitor_filters = esp32_exception_decoder

build_flags =
    -Ofast
    -Wall
    -Iinclude
    -D CORE_DEBUG_LEVEL=ARDUHAL_LOG_LEVEL_INFO
    -D LV_CONF_PATH=lv_conf.h
    ; LVGL v9's lv_color_t is a fixed 3-byte struct (RGB565 is lv_color16_t now),
    ; but esp32_smartdisplay@2.1.1 still sizes the draw buffer as
    ; sizeof(lv_color_t) * LVGL_BUFFER_PIXELS. The board's own default
    ; (DISPLAY_WIDTH*DISPLAY_HEIGHT/4 = 38400px) then asks for a 115200-byte
    ; contiguous internal-RAM block, which fails against heap fragmentation
    ; even with plenty of free heap overall. Override to a smaller buffer.
    -D LVGL_BUFFER_PIXELS=19200
    '-D ESP_LCD_PANEL_IO_ADDITIONS_VER_MAJOR=1'
    '-D ESP_LCD_PANEL_IO_ADDITIONS_VER_MINOR=0'
    '-D ESP_LCD_PANEL_IO_ADDITIONS_VER_PATCH=1'

lib_deps =
    rzeldent/esp32_smartdisplay@2.1.1
    lvgl/lvgl@9.2.2

; Uncomment and set explicitly if auto-detection picks the wrong port:
; upload_port = COM5
; monitor_port = COM5
